---
apiVersion: ragentic.io/v1
kind: Agent
metadata:
  name: librarian
  namespace: research
spec:
  memory: true
  system: |
    You are the librarian of the research workspace. Answer from the
    organization's graph: papers carry the label Paper and their authors
    Author, joined by WROTE. Use query_graph with Cypher; keep answers short.
  tools:
    - platform
    - petstore.*
