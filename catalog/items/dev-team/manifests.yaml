    - kind: Workflow
      metadata:
        name: stage-implement
        namespace: devteam
      spec:
        description: a ToImplement hand-off — the developer implements and hands it to review (one run per ticket, each an instance of its own)
        edges:
          - from: start
            to: prep
          - from: prep
            to: ask
          - from: ask
            to: advance
        nodes:
          - id: start
            type: trigger
          - config:
              code: |
                -- one run per ticket (each: true): the ticket is the run's unit, its touches its conflicts
                local parts, tickets, touches = {}, {}, {}
                for _, k in ipairs((input.trigger and input.trigger.keys) or {}) do
                  local hid = k:match("^ws:devteam/ToImplement/(.+)$")
                  if hid then
                    local h = ragentic.graph.query(string.format('MATCH (h:ToImplement {ws:"devteam", key:%q}) RETURN h.ticket AS ticket', hid))
                    local id = h and h[1] and h[1].ticket
                    local r = id and ragentic.graph.query(string.format('MATCH (t:Ticket {ws:"devteam", key:%q}) RETURN t.title AS title, t.description AS description, t.repo AS repo, t.acceptance AS acceptance, t.notes AS notes, t.branch AS branch, t.pr AS pr, t.touches AS touches', id))
                    r = r and r[1]
                    if r then
                      local d = ragentic.graph.query(string.format('MATCH (a:Artifact {ws:"devteam", key:%q}) RETURN a.body AS body', id .. ":design"))
                      local design = (d and d[1] and d[1].body) or "-"
                      parts[#parts + 1] = string.format("Ticket %s: %s\nrepo: %s\nBranch so far: %s\nPull request so far: %s\n%s\nAcceptance: %s\nDesign: %s\nNotes from review/QA: %s", id, r.title or "", r.repo or "-", r.branch or "-", r.pr or "-", r.description or "", r.acceptance or "-", design, r.notes or "-")
                      tickets[#tickets + 1] = id
                      if type(r.touches) == "table" then
                        for _, t in ipairs(r.touches) do touches[#touches + 1] = tostring(t) end
                      elseif type(r.touches) == "string" and r.touches ~= "" then
                        touches[#touches + 1] = r.touches
                      end
                    end
                  end
                end
                if #parts == 0 then error("no devteam ToImplement hand-off in this event") end
                return {
                  prompt = "Implement this ticket.\n\n" .. table.concat(parts, "\n\n"),
                  ticket = table.concat(tickets, "+"),
                  touches = table.concat(touches, "\n")
                }
            id: prep
            type: lua
          - config:
              agent: developer
              prompt: '{{prep.prompt}}'
              touches: '{{prep.touches}}'
              unit: '{{prep.ticket}}'
            id: ask
            type: agent
          - config:
              code: |
                -- deterministic hand-off: the stage the agent set decides the next label; its answer is the artifact
                local next_label = { review = "ToReview" }
                local text = (input.ask and input.ask.text) or ""
                local done = {}
                for _, k in ipairs((input.trigger and input.trigger.keys) or {}) do
                  local hid = k:match("^ws:devteam/ToImplement/(.+)$")
                  if hid then
                    local h = ragentic.graph.query(string.format('MATCH (h:ToImplement {ws:"devteam", key:%q}) RETURN h.ticket AS ticket', hid))
                    local id = h and h[1] and h[1].ticket
                    if id then
                      local r = ragentic.graph.query(string.format('MATCH (t:Ticket {ws:"devteam", key:%q}) RETURN t.stage AS stage', id))
                      local stage = r and r[1] and r[1].stage
                      if text ~= "" then
                        local ok, err = ragentic.graph.put_node("Artifact", { id = id .. ":patch", kind = "patch", ticket = id, author = "developer", body = text })
                        if not ok then error("artifact: " .. tostring(err)) end
                        ragentic.graph.put_edge("PRODUCED", "Ticket", id, "Artifact", id .. ":patch")
                      end
                      local nl = stage and next_label[stage]
                      if nl then
                        local ok, err = ragentic.graph.put_node(nl, { id = id .. ":" .. stage, ticket = id })
                        if not ok then error("hand-off: " .. tostring(err)) end
                      end
                      ragentic.log(string.format("%s: stage %s, hand-off %s", id, tostring(stage), nl or "none"))
                      done[#done + 1] = { ticket = id, stage = stage or "unchanged", handoff = nl or "none" }
                    end
                  end
                end
                return done
            id: advance
            type: lua
        triggers:
          - each: true
            label: ToImplement
            type: graph_event
          - type: manual
    - kind: Workflow
