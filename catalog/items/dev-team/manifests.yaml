                    local id = h and h[1] and h[1].ticket
                    local r = id and ragentic.graph.query(string.format('MATCH (t:Ticket {ws:"devteam", key:%q}) RETURN t.title AS title, t.description AS description, t.branch AS branch, t.pr AS pr', id))
                    r = r and r[1]
                    if r then
                      local p = ragentic.graph.query(string.format('MATCH (a:Artifact {ws:"devteam", key:%q}) RETURN a.body AS body', id .. ":patch"))
                      parts[#parts + 1] = string.format("Ticket %s: %s\n%s\nBranch: %s\nPull request: %s\nWhat was built: %s", id, r.title or "", r.description or "", r.branch or "-", r.pr or "-", (p and p[1] and p[1].body) or "-")
                    end
                  end
                end
                if #parts == 0 then error("no devteam ToRelease hand-off in this event") end
                return "Release this ticket.\n\n" .. table.concat(parts, "\n\n")
            id: prep
            type: lua
          - config:
              agent: release-manager
              prompt: '{{prep}}'
            id: ask
            type: agent
          - config:
              code: |
                -- deterministic hand-off: the stage the agent set decides the next label; its answer is the artifact
                local next_label = {  }
                local text = (input.ask and input.ask.text) or ""
                local done = {}
                for _, k in ipairs((input.trigger and input.trigger.keys) or {}) do
                  local hid = k:match("^ws:devteam/ToRelease/(.+)$")
                  if hid then
                    local h = ragentic.graph.query(string.format('MATCH (h:ToRelease {ws:"devteam", key:%q}) RETURN h.ticket AS ticket', hid))
                    local id = h and h[1] and h[1].ticket
                    if id then
                      local r = ragentic.graph.query(string.format('MATCH (t:Ticket {ws:"devteam", key:%q}) RETURN t.stage AS stage', id))
                      local stage = r and r[1] and r[1].stage
                      if text ~= "" then
                        local ok, err = ragentic.graph.put_node("Artifact", { id = id .. ":release-note", kind = "release-note", ticket = id, author = "release-manager", body = text })
                        if not ok then error("artifact: " .. tostring(err)) end
                        ragentic.graph.put_edge("PRODUCED", "Ticket", id, "Artifact", id .. ":release-note")
                      end
                      local nl = stage and next_label[stage]
                      if nl then
                        local ok, err = ragentic.graph.put_node(nl, { id = id .. ":" .. stage, ticket = id })
                        if not ok then error("hand-off: " .. tostring(err)) end
                      end
                      -- the epic moves on: its next backlog ticket (lowest id) goes to triage
                      if stage == "done" then
                        local nxt = ragentic.graph.query(string.format('MATCH (t:Ticket {ws:"devteam", key:%q})-[:BELONGS_TO]->(e:Epic)<-[:BELONGS_TO]-(n:Ticket {stage:"backlog"}) RETURN n.key AS id ORDER BY id LIMIT 1', id))
                        local nid = nxt and nxt[1] and nxt[1].id
                        if nid then
                          local ok, err = ragentic.graph.put_node("ToTriage", { id = nid .. ":triage", ticket = nid })
                          if not ok then error("epic next: " .. tostring(err)) end
                          ragentic.log(id .. " done; epic continues with " .. nid)
                        end
                      end
                      ragentic.log(string.format("%s: stage %s, hand-off %s", id, tostring(stage), nl or "none"))
                      done[#done + 1] = { ticket = id, stage = stage or "unchanged", handoff = nl or "none" }
                    end
                  end
                end
                return done
            id: advance
            type: lua
        triggers:
          - label: ToRelease
            type: graph_event
          - type: manual
    - kind: Workflow
      metadata:
        name: standup
        namespace: devteam
      spec:
        description: the daily standup — the board as it stands, summarized by the scrum-master into a Report node
        edges:
          - from: start
            to: board
          - from: board
            to: ask
          - from: ask
            to: save
        nodes:
          - id: start
            type: trigger
          - config:
              code: |
                local rows = ragentic.graph.query('MATCH (t:Ticket {ws:"devteam"}) RETURN t.key AS id, t.title AS title, t.stage AS stage, t.assignee AS assignee, t.priority AS priority, t.notes AS notes ORDER BY t.stage') or {}
                if #rows == 0 then return "The board is empty: no tickets yet." end
                local lines = {}
                for _, r in ipairs(rows) do
                  lines[#lines + 1] = string.format("- %s [%s] %s — %s (%s) %s", r.id, r.stage or "?", r.title or "", r.assignee or "unassigned", r.priority or "-", r.notes and r.notes ~= "" and ("notes: " .. r.notes) or "")
                end
                return "Board (" .. #rows .. " tickets):\n" .. table.concat(lines, "\n")
            id: board
            type: lua
          - config:
              agent: scrum-master
              prompt: |-
                Write today's standup from this board: what moved, what is blocked or stuck in one stage, what needs a human decision. Under 120 words.

                {{board}}
            id: ask
            type: agent
          - config:
              code: |
                local at = (input.trigger and input.trigger.at) or "manual"
                local text = (input.ask and input.ask.text) or ""
                local ok, err = ragentic.graph.put_node("Report", { id = "standup-" .. at, body = text, at = at })
                if not ok then error("report: " .. tostring(err)) end
                return { id = "standup-" .. at, body = text }
            id: save
            type: lua
        triggers:
          - schedule: 0 14 * * 1-5
            type: cron
          - type: manual
  version: 1.0.0
