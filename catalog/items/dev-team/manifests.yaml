                      local p = ragentic.graph.query(string.format('MATCH (a:Artifact {ws:"devteam", key:%q}) RETURN a.body AS body', id .. ":patch"))
                      parts[#parts + 1] = string.format("Ticket %s: %s\nBranch: %s\nPull request: %s\nAcceptance: %s\nDesign: %s\nImplementation report: %s", id, r.title or "", r.branch or "-", r.pr or "-", r.acceptance or "-", (d and d[1] and d[1].body) or "-", (p and p[1] and p[1].body) or "-")
                    end
                  end
                end
                if #parts == 0 then error("no devteam ToReview hand-off in this event") end
                return "Review this implementation.\n\n" .. table.concat(parts, "\n\n")
            id: prep
            type: lua
          - config:
              agent: reviewer
              prompt: '{{prep}}'
            id: ask
            type: agent
          - config:
              code: |
                -- deterministic hand-off: the stage the agent set decides the next label; its answer is the artifact
                local next_label = { test = "ToTest", implement = "ToImplement" }
                local text = (input.ask and input.ask.text) or ""
                local done = {}
                for _, k in ipairs((input.trigger and input.trigger.keys) or {}) do
                  local hid = k:match("^ws:devteam/ToReview/(.+)$")
                  if hid then
                    local h = ragentic.graph.query(string.format('MATCH (h:ToReview {ws:"devteam", key:%q}) RETURN h.ticket AS ticket', hid))
                    local id = h and h[1] and h[1].ticket
                    if id then
                      local r = ragentic.graph.query(string.format('MATCH (t:Ticket {ws:"devteam", key:%q}) RETURN t.stage AS stage', id))
                      local stage = r and r[1] and r[1].stage
                      if text ~= "" then
                        local ok, err = ragentic.graph.put_node("Artifact", { id = id .. ":review", kind = "review", ticket = id, author = "reviewer", body = text })
                        if not ok then error("artifact: " .. tostring(err)) end
                        ragentic.graph.put_edge("PRODUCED", "Ticket", id, "Artifact", id .. ":review")
                      end
                      local nl = stage and next_label[stage]
                      if nl == "ToImplement" then
                        local b = ragentic.graph.query(string.format('MATCH (t:Ticket {ws:"devteam", key:%q}) RETURN t.bounces AS bounces', id))
                        local bounces = ((b and b[1] and b[1].bounces) or 0) + 1
                        if bounces >= 2 then
                          local ok, err = ragentic.graph.put_node("Ticket", { id = id, stage = "blocked", bounces = bounces, notes = "needs a human: sent back " .. bounces .. " times — see the latest review/test-report artifact" })
                          if not ok then error("block: " .. tostring(err)) end
                          stage, nl = "blocked", nil
                        else
                          ragentic.graph.put_node("Ticket", { id = id, bounces = bounces })
                        end
                      end
                      if nl then
                        local ok, err = ragentic.graph.put_node(nl, { id = id .. ":" .. stage, ticket = id })
                        if not ok then error("hand-off: " .. tostring(err)) end
                      end
                      ragentic.log(string.format("%s: stage %s, hand-off %s", id, tostring(stage), nl or "none"))
                      done[#done + 1] = { ticket = id, stage = stage or "unchanged", handoff = nl or "none" }
                    end
                  end
                end
                return done
            id: advance
            type: lua
        triggers:
          - label: ToReview
            type: graph_event
          - type: manual
