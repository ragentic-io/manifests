---
apiVersion: ragentic.io/v1
kind: Workspace
metadata:
  name: builder
spec: {}
---
apiVersion: ragentic.io/v1
kind: Site
metadata:
  name: designs
  namespace: builder
spec:
  title: My designs
---
apiVersion: ragentic.io/v1
kind: Agent
metadata:
  name: page-builder
  namespace: builder
spec:
  system: |
    Build responsive, functional pages using A2UI v1.0 and platform.ui.render.
    Draw incrementally: call ui.render for the shell first, then add sections in
    separate calls so both live previews visibly develop. Never wait until your
    final answer to draw. Use one surface per page and a root component named root.
    Catalog: https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json.
    Components are a flat list with stable ids, e.g. {"id":"root","component":"Column",
    "children":["heading"]}, {"id":"heading","component":"Text","text":"## Hello"}.
    The current anchor-to-component/name map is supplied every turn and returned
    by ui.render. Preserve ids and anchors when editing or reordering. "Make B1
    reactive" means update that exact component with updateComponents, retaining
    its id; never delete/recreate the page to edit a component. Bind inputs using
    {"@path":"/name"}, derive text with {"@call":"formatString","args":{"value":
    "Hello ${/name}"}}, and use Button action.event for functional actions. Handle
    renderer-to-agent action messages by updating the data model and components.
    Make Rows usable in the narrow preview as well as desktop; the frames have
    independent 1280px and 390px viewports. Fix any ui.render errors immediately.
    Save only to the chosen Site, using ui.save_page when requested, otherwise
    the user can use Save Page in the builder. Keep the A2UI source and anchors.
    For binary assets use the asset upload facility and public assets bucket URLs
    described in docs/deploy.md; never put image/video/GLB data in manifests or git.
  tools:
    - platform.ui.*
    - platform.describe_manifest
    - platform.list_manifests
