---
kind: Workspace
metadata:
  name: default
spec: {}
---
kind: Site
metadata:
  name: porch
  namespace: default
spec:
  css: |
    :root {
      background:
        repeating-linear-gradient(90deg, transparent 0 46px, color-mix(in oklab, var(--t-line) 18%, transparent) 46px 47px),
        var(--t-bg);
    }
    .masthead { border-bottom: 3px double var(--t-brass); padding-bottom: 10px; }
    .masthead .st-h1 { font-size: clamp(2rem, 6vw, 3.6rem); letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
    .masthead .st-text { font-family: var(--font-mono); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--t-muted); }
    .levers .st-action { font-family: var(--font-display); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; min-width: 9rem; }
    .panel { background: var(--t-surface); border: 1px solid var(--t-line); border-radius: var(--t-radius); padding: 14px; box-shadow: var(--t-shadow); }
    .panel-title .st-h { font-size: .95rem; letter-spacing: .14em; text-transform: uppercase; color: var(--t-muted); }
    @media (max-width: 640px) { .levers .st-action { min-width: 0; flex: 1; } }
  description: "The porch's lamps, rain and events, on the Pi's screen"
  layout: bare
  theme:
    dark:
      accent: '#d9a441'
      bad: '#ff7b6b'
      bg: '#101b15'
      enamel: '#203d2e'
      fg: '#efe6cf'
      info: '#7cc8de'
      line: '#3d5a47'
      muted: '#a9b5a3'
      ok: '#6fd18a'
      onAccent: '#101b15'
      shadow: '0 2px 0 #0006'
      sunk: '#0c150f'
      surface: '#182a20'
      warn: '#f0c060'
    fonts:
      body:
        family: IBM Plex Sans Condensed
        weights:
          - 400
          - 600
      display:
        family: Big Shoulders Stencil Display
        weights:
          - 600
          - 800
      mono:
        family: JetBrains Mono
        weights:
          - 500
    tokens:
      accent: '#8c2f1e'
      bad: '#b3261e'
      bg: '#e9e1cb'
      board: '#11140f'
      board-ink: '#ffc94a'
      brass: '#b08d57'
      enamel: '#1f3b2d'
      fg: '#1d3328'
      glass: '#2a2a24'
      info: '#2b6f86'
      lamp: '#ffb547'
      line: '#9c8a5c'
      muted: '#5b6b5f'
      ok: '#2f7d46'
      onAccent: '#f4eedc'
      radius: 4px
      radiusControl: 4px
      shadow: '0 1px 0 #fff8 inset, 0 2px 0 #0002'
      sunk: '#ddd3b8'
      surface: '#f4eedc'
      warn: '#b7791f'
  title: Porch Station
---
kind: Component
metadata:
  name: lamp-plate
  namespace: default
spec:
  css: |
    .plate { align-items: center; gap: 10px; padding: 16px 12px 12px; border-radius: 14px;
             background: linear-gradient(180deg, color-mix(in oklab, var(--t-enamel) 92%, #fff) 0%, var(--t-enamel) 100%);
             border: 2px solid var(--t-brass); box-shadow: inset 0 0 0 4px color-mix(in oklab, var(--t-enamel) 70%, #000); }
    .bezel { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center;
             background: radial-gradient(circle at 35% 30%, #e8d3a2, var(--t-brass) 55%, #5e4824 100%); }
    .bezel .st-text { width: 64px; height: 64px; max-width: none; border-radius: 50%; margin: 0; font-size: 0;
                      background: radial-gradient(circle at 38% 34%, #555 0%, var(--t-glass) 60%);
                      box-shadow: inset 0 3px 8px #000a; transition: background 300ms, box-shadow 300ms; }
    .clear .bezel .st-text { background: radial-gradient(circle at 38% 34%, #d6ffd9 0%, #3fbf62 45%, #145c2a 100%); box-shadow: 0 0 22px #3fbf62aa, inset 0 -3px 6px #0006; }
    .working .bezel .st-text { background: radial-gradient(circle at 38% 34%, #fff1c9 0%, var(--t-lamp) 45%, #8a4f00 100%); box-shadow: 0 0 22px #ffb547aa, inset 0 -3px 6px #0006; animation: pulse 1s ease-in-out infinite; }
    .fault .bezel .st-text { background: radial-gradient(circle at 38% 34%, #ffd0c9 0%, #e5402f 45%, #6d120a 100%); box-shadow: 0 0 22px #e5402faa, inset 0 -3px 6px #0006; }
    .rain .bezel .st-text { background: radial-gradient(circle at 38% 34%, #d9f4ff 0%, #4fb3d9 45%, #11506b 100%); box-shadow: 0 0 22px #4fb3d9aa, inset 0 -3px 6px #0006; }
    .legend .st-text { margin: 0; padding: 2px 10px; border-radius: 3px; background: #f1e7c8; color: #1d1d1d;
                       font-family: var(--font-display); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .note .st-text { margin: 0; font-family: var(--font-mono); font-size: .72rem; color: #e9dfc2; opacity: .8; }
    @keyframes pulse { 50% { filter: brightness(.7); } }
    @media (prefers-reduced-motion: reduce) { .working .bezel .st-text { animation: none; } }
  description: A round signal lamp on an enamel plate, with its legend below
  example:
    detail: Lamp toggled 07:41
    label: Line
    state: clear
  props:
    properties:
      detail:
        default: ''
        type: string
      label:
        type: string
      state:
        default: idle
        description: idle, clear, working, fault or rain
        type: string
    required:
      - label
    type: object
  template:
    - stack:
        aria:
          label: '{{label}}: {{state}}'
        children:
          - stack:
              children:
                - text:
                    text: '{{state}}'
              class: bezel
          - stack:
              children:
                - text: '{{label}}'
              class: legend
          - $if: detail
            then:
              - stack:
                  children:
                    - text: '{{detail}}'
                  class: note
        class: plate {{state}}
---
kind: Component
metadata:
  name: rain-strip
  namespace: default
spec:
  css: |
    .strip { gap: 6px; align-items: flex-end; padding: 10px 12px; border-radius: 6px; background: var(--t-board); }
    .drop { flex: 1; }
    .drop .st-text { margin: 0; max-width: none; height: 34px; border-radius: 2px 2px 8px 8px; font-size: 0;
                     background: color-mix(in oklab, var(--t-info) 18%, var(--t-board)); transition: background 400ms; }
    .drop.wet .st-text { background: linear-gradient(180deg, #bfeaff, var(--t-info)); box-shadow: 0 0 10px color-mix(in oklab, var(--t-info) 60%, transparent); }
    .readings { gap: 18px; flex-wrap: wrap; }
    .readings .st-stat { min-width: 6rem; }
    .readings .st-stat * { font-family: var(--font-mono); }
  description: The BME280's humidity as a strip of ten drops, with temperature and pressure
  example:
    sensor:
      humidity: 72.5
      pressureHpa: 1004.2
      temperatureC: 12.3
  props:
    properties:
      drops:
        default:
          - t: 10
          - t: 20
          - t: 30
          - t: 40
          - t: 50
          - t: 60
          - t: 70
          - t: 80
          - t: 90
          - t: 95
        type: array
      sensor:
        type: object
    type: object
  template:
    - stack:
        children:
          - stack:
              aria:
                label: 'humidity {{sensor.humidity | round: 0}} percent'
              children:
                - $each: drops
                  as: d
                  do:
                    - stack:
                        children:
                          - text: '{{d.t}}'
                        class: "drop {{sensor.humidity >= d.t and 'wet' or 'dry'}}"
              class: strip
              direction: row
          - stack:
              children:
                - stat:
                    label: Humidity
                    value: "{{sensor.humidity | round: 0 | default: '—'}} %"
                - stat:
                    label: Temperature
                    value: "{{sensor.temperatureC | round: 1 | default: '—'}} °C"
                - stat:
                    label: Pressure
                    value: "{{sensor.pressureHpa | round: 0 | default: '—'}} hPa"
              class: readings
              direction: row
        gap: sm
---
kind: Component
metadata:
  name: events-board
  namespace: default
spec:
  css: |
    .board { background: var(--t-board); border-radius: 6px; padding: 10px 12px; border: 3px solid #000;
             box-shadow: inset 0 0 0 1px #333, inset 0 10px 30px #0008; }
    .row { gap: 12px; padding: 6px 0; border-bottom: 1px dashed #ffffff1a; align-items: baseline; }
    .row .st-text { margin: 0; font-family: var(--font-mono); color: var(--t-board-ink); text-shadow: 0 0 6px #ffc94a66; letter-spacing: .06em; }
    .when { width: 4.5rem; flex: none; }
    .what { flex: 1; text-transform: uppercase; }
    .row.failed .st-text { color: #ff7b6b; text-shadow: 0 0 6px #ff7b6b66; }
    .row.running .what .st-text { animation: flick 1.2s steps(2) infinite; }
    .empty .st-text { color: #ffc94a99; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .1em; }
    @keyframes flick { 50% { opacity: .45; } }
  description: A departure board of the lamps' events, newest first
  example:
    events:
      - started_at: 2026-11-19T07:41:00Z
        state: ok
        what: Lamp toggled
  props:
    properties:
      events:
        default: []
        type: array
    type: object
  template:
    - stack:
        children:
          - $if: '{{not events}}'
            then:
              - stack:
                  children:
                    - text: No departures — the line is quiet
                  class: empty
          - $each: events
            as: e
            do:
              - stack:
                  children:
                    - stack:
                        children:
                          - text: "{{e.started_at | date: 'HH:mm'}}"
                        class: when
                    - stack:
                        children:
                          - text: '{{e.what}}'
                        class: what
                    - tag:
                        text: '{{e.state}}'
                        tone: "{{e.state == 'failed' and 'bad' or e.state == 'running' and 'run' or 'ok'}}"
                  class: row {{e.state}}
                  direction: row
        class: board
        gap: sm
---
kind: Page
metadata:
  name: porch
  namespace: default
spec:
  actions:
    blink:
      args:
        device: '{{device}}'
      busy: Blinking…
      confirm: Blink the porch lamp ten times?
      record:
        id: '{{run_id}}'
        label: PorchEvent
        props:
          device: '{{device}}'
          what: Lamp blinked ×10
      workflow: raspberry-pi/blink
    toggle:
      args:
        device: '{{device}}'
      busy: Pulling…
      record:
        id: '{{run_id}}'
        label: PorchEvent
        props:
          device: '{{device}}'
          what: Lamp toggled
      workflow: raspberry-pi/led-toggle
  body:
    - stack:
        children:
          - heading:
              level: 1
              text: Porch Station
          - text: Signal box · {{device}}
        class: masthead
        gap: sm
    - grid:
        children:
          - lamp-plate:
              detail: "{{last.what | default: 'No pulls yet'}}"
              label: Lamp
              state: "{{not last and 'idle' or last.state == 'running' and 'working' or last.state == 'failed' and 'fault' or 'clear'}}"
          - lamp-plate:
              detail: "{{sensor.humidity | round: 0 | default: '—'}} % humidity"
              label: Rain
              state: "{{sensor.humidity >= 85 and 'rain' or 'idle'}}"
          - stack:
              children:
                - stack:
                    children:
                      - heading:
                          level: 3
                          text: Levers
                    class: panel-title
                - stack:
                    children:
                      - button:
                          action: toggle
                          text: Toggle
                          tone: primary
                      - button:
                          action: blink
                          text: Blink
                    direction: row
                    gap: sm
              class: panel levers
              gap: sm
        cols: 3
    - stack:
        children:
          - stack:
              children:
                - heading:
                    level: 3
                    text: Rain
              class: panel-title
          - rain-strip:
              sensor: '{{sensor}}'
        class: panel
        gap: sm
    - stack:
        children:
          - stack:
              children:
                - heading:
                    level: 3
                    text: Departures
              class: panel-title
          - events-board:
              events: '{{events}}'
        class: panel
        gap: sm
  data:
    device:
      value: nerves-14a3
    events:
      graph: 'MATCH (e:PorchEvent {device: $device}) RETURN e ORDER BY e.started_at DESC LIMIT 8'
      live:
        labels:
          - PorchEvent
      params:
        device: nerves-14a3
    last:
      graph: 'MATCH (e:PorchEvent {device: $device}) RETURN e ORDER BY e.started_at DESC LIMIT 1'
      live:
        labels:
          - PorchEvent
      one: true
      params:
        device: nerves-14a3
    sensor:
      graph: "MATCH (s:Sensor {id: 'bme280'}) RETURN s"
      live:
        labels:
          - Sensor
      one: true
  route: /
  site: porch
  title: Porch Station
